  <main class="container contact-page">
    <h1>Contacta amb mi</h1>
    <p>Escriu-me un missatge i et respondré tan aviat com pugui.</p>
    <form class="contact-form">
      <label for="nom">Nom complet</label>
      <input id="nom" type="text" name="nom" placeholder="Escriu el teu nom complet..." autocomplete="name" required>
      <label for="email">Correu electrònic</label>
      <input id="email" type="email" name="email" placeholder="Escriu el teu correu electrònic..." autocomplete="email" required>
      <label for="assumpte">Assumpte</label>
      <input id="assumpte" type="text" name="assumpte" placeholder="Escriu l'assumpte del missatge..." required>
      <label for="missatge">Missatge</label>
      <textarea id="missatge" name="missatge" placeholder="Escriu el teu missatge aquí..." rows="5" required></textarea>
      <button type="submit">Enviar</button>
    </form>
  </main>
    


  <footer>
