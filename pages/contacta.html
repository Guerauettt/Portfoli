  <main class="container contact-page">
    <h1>Contacta amb mi</h1>
    <p>Escriu-me un missatge i et respondré tan aviat com pugui.</p>
    <form class="contact-form">
      <input type="text" name="nom" placeholder="Nom complet" aria-label="Nom complet" autocomplete="name" required>
      <input type="email" name="email" placeholder="Correu electrònic" aria-label="Correu electrònic" autocomplete="email" required>
      <input type="text" name="assumpte" placeholder="Assumpte" aria-label="Assumpte" required>
      <textarea name="missatge" placeholder="Missatge" aria-label="Missatge" rows="5" required></textarea>
      <button type="submit">Enviar</button>
    </form>
  </main>
